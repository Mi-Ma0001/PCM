name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: APK de test (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/debug/app-debug.apk sortie/plan-maintenance-cms-${{ github.run_number }}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plan-maintenance-cms-android
          path: sortie/*.apk
